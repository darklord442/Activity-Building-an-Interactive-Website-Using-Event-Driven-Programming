<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bidly — Live Auctions</title>
  <style>
    :root {
      --bg: #0b0d14;
      --surface: #131722;
      --surface-2: #1a1f2e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8eaf2;
      --muted: #8b91a7;
      --accent: #8b5cf6;
      --accent-2: #ec4899;
      --success: #22c55e;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(800px 400px at 10% -10%, rgba(139, 92, 246, 0.18), transparent 60%),
        radial-gradient(700px 400px at 100% 0%, rgba(236, 72, 153, 0.12), transparent 60%),
        var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px 56px;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.82rem;
      color: var(--muted);
    }

    .live-status .online,
    .live-status .offline {
      color: var(--text);
      font-weight: 600;
    }

    .live-status .online::before,
    .live-status .offline::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }

    .live-status .offline::before {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.18);
    }

    .hero {
      padding: 32px 0 8px;
    }

    .page-title {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .page-title .gradient {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 180px 180px 1fr;
      gap: 16px;
      margin: 32px 0;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }

      .bid-box {
        grid-column: 1 / -1;
      }
    }

    .box {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .center-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .gavel {
      color: var(--accent);
      cursor: pointer;
      transition: width 0.2s ease, height 0.2s ease;
    }

    .caption {
      font-size: 0.8rem;
      color: var(--muted);
    }

    #bidForm {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    #bidForm label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #bidForm .full {
      grid-column: 1 / -1;
    }

    input,
    select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background-color: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      text-transform: none;
      letter-spacing: normal;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input::placeholder {
      color: #5d6378;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary {
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    #bidMessage {
      grid-column: 1 / -1;
      margin: 0;
      min-height: 1.2em;
      font-size: 0.9rem;
    }

    #bidMessage.ok {
      color: var(--success);
    }

    #bidMessage.error {
      color: var(--danger);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 40px 0 16px;
      flex-wrap: wrap;
    }

    h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    #myInput {
      width: 280px;
      max-width: 100%;
    }

    .table-box {
      padding: 0;
      overflow-x: auto;
    }

    #lots {
      width: 100%;
      border-collapse: collapse;
    }

    #lots th,
    #lots td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    #lots .header th {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #lots tbody tr {
      transition: background-color 0.15s ease;
    }

    #lots tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    #lots tr:last-child td {
      border-bottom: none;
    }

    .lot-no {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .item-name {
      font-weight: 600;
    }

    .item-desc {
      display: block;
      margin-top: 2px;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--muted);
    }

    .price {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .time-left {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    td.ending-soon {
      color: var(--warning);
      font-weight: 600;
    }

    td.sold {
      color: var(--muted);
    }

    tr.just-bid td {
      animation: flash 1.2s ease;
    }

    @keyframes flash {
      from { background-color: rgba(139, 92, 246, 0.25); }
      to { background-color: transparent; }
    }

    .history {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .history li {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }

    .history li:first-child {
      padding-top: 0;
    }

    .history li:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .history .empty {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="brand"><span class="brand-mark"></span>Bidly</div>
      <p class="live-status"><span id="connStatus" class="offline">Connecting...</span> <span><span id="watchers">0</span> watching</span></p>
    </nav>

    <header class="hero">
      <h1 class="page-title">Live auctions, <span class="gradient">in real time.</span></h1>
      <p class="tagline">Bid on modern collectibles. Every bid updates instantly for everyone watching.</p>
    </header>

    <div class="grid">
      <div class="box center-box">
        <button id="welcomeButton" class="secondary">How it works</button>
      </div>

      <div class="box center-box">
        <svg id="gavel" class="gavel" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Auction gavel">
          <path d="m14.5 12.5-8 8a2.12 2.12 0 1 1-3-3l8-8" />
          <path d="m16 16 6-6" />
          <path d="m8 8 6-6" />
          <path d="m9 7 8 8" />
          <path d="m21 11-8-8" />
        </svg>
        <span class="caption">Hover me</span>
      </div>

      <div class="box bid-box">
        <form id="bidForm" novalidate>
          <label>
            Your name
            <input type="text" id="nameInput" name="nameInput" autocomplete="name" placeholder="e.g. Prince" />
          </label>
          <label>
            Your bid ($)
            <input type="number" id="bidAmount" name="bidAmount" min="1" step="1" placeholder="0" />
          </label>
          <label class="full">
            Lot
            <select id="lotSelect" name="lotSelect"></select>
          </label>
          <button type="submit" class="full">Place bid</button>
          <p id="bidMessage" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <div class="section-head">
      <h2>Live lots</h2>
      <input type="text" id="myInput" placeholder="Search lots or categories..." title="Search lots" />
    </div>

    <div class="box table-box">
      <table id="lots">
        <thead>
          <tr class="header">
            <th style="width:8%;">Lot</th>
            <th>Item</th>
            <th style="width:14%;">Category</th>
            <th style="width:15%;">Current bid</th>
            <th style="width:8%;">Bids</th>
            <th style="width:14%;">Time left</th>
          </tr>
        </thead>
        <tbody id="lotRows"></tbody>
      </table>
    </div>

    <div class="section-head">
      <h2>Recent bids</h2>
    </div>
    <div class="box">
      <ul id="bidHistory" class="history">
        <li class="empty">No bids placed yet.</li>
      </ul>
    </div>
  </div>

  <script>
    let ws = null;
    let lots = [];
    let minIncrement = 10;
    let clockOffset = 0;

    function serverNow() {
      return Date.now() + clockOffset;
    }

    function formatMoney(amount) {
      return "$" + amount.toLocaleString("en-US");
    }

    function formatTimeLeft(ms) {
      if (ms <= 0) {
        return "Sold";
      }
      const totalSeconds = Math.floor(ms / 1000);
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const pad = function (n) { return String(n).padStart(2, "0"); };
      return (h > 0 ? h + "h " : "") + pad(m) + "m " + pad(s) + "s";
    }

    function isClosed(lot) {
      return lot.endsAt - serverNow() <= 0;
    }

    function cell(className, text) {
      const td = document.createElement("td");
      if (className) {
        td.className = className;
      }
      td.textContent = text;
      return td;
    }

    function buildRow(lot) {
      const row = document.createElement("tr");
      row.dataset.lotId = lot.id;

      const item = cell("item-name", lot.name);
      const desc = document.createElement("span");
      desc.className = "item-desc";
      desc.textContent = lot.desc;
      item.appendChild(desc);

      const price = cell("price", formatMoney(lot.bid));
      if (lot.highBidder) {
        const bidder = document.createElement("span");
        bidder.className = "item-desc";
        bidder.textContent = "by " + lot.highBidder;
        price.appendChild(bidder);
      }

      row.append(
        cell("lot-no", "#" + lot.id),
        item,
        cell("", lot.category),
        price,
        cell("bid-count", String(lot.bids)),
        cell("time-left", "")
      );
      return row;
    }

    function renderLots() {
      const tbody = document.getElementById("lotRows");
      tbody.innerHTML = "";
      lots.forEach(function (lot) {
        tbody.appendChild(buildRow(lot));
      });
      updateTimers();
      searchTable();
    }

    function renderLotOptions() {
      const select = document.getElementById("lotSelect");
      const current = select.value;
      select.innerHTML = "";

      lots.forEach(function (lot) {
        const option = document.createElement("option");
        option.value = lot.id;
        option.disabled = isClosed(lot);
        option.textContent = "#" + lot.id + " " + lot.name + " (min " + formatMoney(lot.bid + minIncrement) + ")" + (option.disabled ? " - Sold" : "");
        select.appendChild(option);
      });

      if (current) {
        select.value = current;
      }
    }

    function updateTimers() {
      let anyJustClosed = false;

      document.querySelectorAll("#lotRows tr").forEach(function (row) {
        const lot = lots.find(function (l) { return String(l.id) === row.dataset.lotId; });
        const timeCell = row.querySelector(".time-left");
        const msLeft = lot.endsAt - serverNow();

        timeCell.textContent = formatTimeLeft(msLeft);
        timeCell.classList.toggle("ending-soon", msLeft > 0 && msLeft < 10 * 60 * 1000);
        timeCell.classList.toggle("sold", msLeft <= 0);

        if (msLeft <= 0 && !lot.closed) {
          lot.closed = true;
          anyJustClosed = true;
        }
      });

      if (anyJustClosed) {
        renderLotOptions();
      }
    }

    function bigImg(x) {
      x.style.width = "64px";
      x.style.height = "64px";
    }

    function normalImg(x) {
      x.style.width = "32px";
      x.style.height = "32px";
    }

    function myFunction() {
      const nameInput = document.getElementById("nameInput");
      const name = nameInput ? nameInput.value.trim() : "";
      const greeting =
        (name ? "Welcome, " + name + "!" : "Welcome to Bidly!") +
        "\n\nPick a lot, enter a bid at least " + formatMoney(minIncrement) +
        " above the current bid, and press Place Bid. Bids update live for everyone watching. The highest bid when the timer runs out wins.";

      if (typeof alert === "function") {
        alert(greeting);
      }

      return greeting;
    }

    function searchTable() {
      const input = document.getElementById("myInput");
      const tbody = document.getElementById("lotRows");

      if (!input || !tbody) {
        return;
      }

      const filter = input.value.toLowerCase();
      const rows = tbody.getElementsByTagName("tr");

      for (let i = 0; i < rows.length; i++) {
        const text = rows[i].textContent.toLowerCase();
        rows[i].style.display = text.includes(filter) ? "" : "none";
      }
    }

    function setMessage(text, type) {
      const message = document.getElementById("bidMessage");
      message.textContent = text;
      message.className = type;
    }

    function historyText(entry) {
      const time = new Date(entry.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      return time + " \u2014 " + entry.name + " bid " + formatMoney(entry.amount) + " on Lot #" + entry.lotId + " (" + entry.lotName + ")";
    }

    function renderHistory(entries) {
      const list = document.getElementById("bidHistory");
      list.innerHTML = "";

      if (entries.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "No bids placed yet.";
        list.appendChild(empty);
        return;
      }

      entries.forEach(function (entry) {
        const item = document.createElement("li");
        item.textContent = historyText(entry);
        list.appendChild(item);
      });
    }

    function addHistory(entry) {
      const list = document.getElementById("bidHistory");
      const empty = list.querySelector(".empty");
      if (empty) {
        empty.remove();
      }

      const item = document.createElement("li");
      item.textContent = historyText(entry);
      list.prepend(item);
    }

    function setConnection(text, online) {
      const status = document.getElementById("connStatus");
      status.textContent = text;
      status.className = online ? "online" : "offline";
    }

    function handleMessage(event) {
      const message = JSON.parse(event.data);

      if (message.type === "init") {
        clockOffset = message.serverTime - Date.now();
        minIncrement = message.minIncrement;
        lots = message.lots;
        renderLots();
        renderLotOptions();
        renderHistory(message.history);
      } else if (message.type === "bid") {
        lots = lots.map(function (lot) { return lot.id === message.lot.id ? message.lot : lot; });
        renderLots();
        renderLotOptions();
        addHistory(message.entry);
        const row = document.querySelector('#lotRows tr[data-lot-id="' + message.lot.id + '"]');
        if (row) {
          row.classList.add("just-bid");
        }
      } else if (message.type === "bid-result") {
        setMessage(message.message, message.ok ? "ok" : "error");
        if (message.ok) {
          document.getElementById("bidAmount").value = "";
        }
      } else if (message.type === "watchers") {
        document.getElementById("watchers").textContent = message.count;
      }
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss://" : "ws://";
      ws = new WebSocket(protocol + location.host);

      ws.addEventListener("open", function () {
        setConnection("Live", true);
      });
      ws.addEventListener("message", handleMessage);
      ws.addEventListener("close", function () {
        setConnection("Reconnecting...", false);
        setTimeout(connect, 2000);
      });
    }

    function placeBid(event) {
      event.preventDefault();

      const name = document.getElementById("nameInput").value.trim();
      const amount = Number(document.getElementById("bidAmount").value);
      const lotId = Number(document.getElementById("lotSelect").value);

      if (!name) {
        setMessage("Please enter your name before bidding.", "error");
        return;
      }
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        setMessage("Not connected to the auction server. Retrying...", "error");
        return;
      }

      ws.send(JSON.stringify({ type: "bid", lotId: lotId, name: name, amount: amount }));
    }

    function updateInputColor(event) {
      event.target.style.backgroundColor = event.type === "keydown" ? "rgba(139, 92, 246, 0.22)" : "rgba(236, 72, 153, 0.16)";
    }

    function attachInputListeners() {
      const nameInput = document.getElementById("nameInput");
      const searchInput = document.getElementById("myInput");
      const form = document.getElementById("bidForm");
      const gavel = document.getElementById("gavel");
      const welcomeButton = document.getElementById("welcomeButton");

      if (nameInput) {
        nameInput.addEventListener("keydown", updateInputColor);
        nameInput.addEventListener("keyup", updateInputColor);
      }

      if (searchInput) {
        searchInput.addEventListener("keyup", searchTable);
      }

      if (gavel) {
        gavel.addEventListener("mouseover", function () { bigImg(gavel); });
        gavel.addEventListener("mouseout", function () { normalImg(gavel); });
      }

      if (welcomeButton) {
        welcomeButton.addEventListener("click", myFunction);
      }

      if (form) {
        form.addEventListener("submit", placeBid);
      }
    }

    function init() {
      attachInputListeners();
      connect();
      setInterval(updateTimers, 1000);
    }

    if (document.readyState !== "loading") {
      init();
    } else {
      document.addEventListener("DOMContentLoaded", init);
    }
  </script>
</body>
</html>

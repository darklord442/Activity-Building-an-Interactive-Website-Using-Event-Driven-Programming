<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Gilded Gavel Auction House</title>
  <style>
    :root {
      --cream: #fbf6ec;
      --paper: #fffdf8;
      --ink: #2b2118;
      --muted: #7a6a58;
      --gold: #b8892f;
      --gold-dark: #8c6420;
      --burgundy: #6e1f2b;
      --line: #e6d9c2;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      margin: 0;
      padding: 40px 20px 40px;
      background: radial-gradient(circle at top, #fffaf0 0%, var(--cream) 60%, #f1e6d2 100%);
      color: var(--ink);
    }

    .page-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .page-title {
      margin: 0;
      font-size: 2.4rem;
      letter-spacing: 1px;
      color: var(--burgundy);
    }

    .tagline {
      margin: 6px 0 0;
      color: var(--muted);
      font-style: italic;
    }

    .divider {
      width: 160px;
      height: 2px;
      margin: 16px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .row {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 20px;
      flex-wrap: wrap;
      margin: 30px auto;
      max-width: 1000px;
    }

    .box {
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 3px 10px rgba(80, 55, 20, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gavel-box {
      min-width: 120px;
      flex-direction: column;
      gap: 6px;
    }

    .gavel {
      cursor: pointer;
      transition: width 0.15s ease, height 0.15s ease;
      user-select: none;
    }

    .gavel-caption {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .bid-box {
      flex: 1;
      min-width: 320px;
    }

    #bidForm {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    #bidForm label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    #bidForm .full {
      grid-column: 1 / -1;
    }

    input,
    select {
      width: 100%;
      padding: 8px 10px;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 6px;
      background-color: #fffaf1;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.95rem;
    }

    input:focus,
    select:focus {
      outline: 2px solid rgba(184, 137, 47, 0.35);
      border-color: var(--gold);
    }

    button {
      background-color: var(--burgundy);
      color: #fff8e8;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    button:hover {
      background-color: #4f1520;
    }

    .secondary {
      background-color: var(--gold);
    }

    .secondary:hover {
      background-color: var(--gold-dark);
    }

    #bidMessage {
      grid-column: 1 / -1;
      margin: 0;
      min-height: 1.2em;
      font-size: 0.9rem;
    }

    #bidMessage.ok {
      color: #2f6b2f;
    }

    #bidMessage.error {
      color: var(--burgundy);
    }

    .catalogue {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px auto;
      max-width: 1000px;
    }

    .catalogue h2 {
      margin: 0;
      color: var(--burgundy);
      font-size: 1.4rem;
    }

    .search-box,
    .table-box {
      width: 100%;
      box-sizing: border-box;
    }

    .table-box {
      padding: 0;
      overflow-x: auto;
    }

    #lots {
      width: 100%;
      border-collapse: collapse;
    }

    #lots th,
    #lots td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    #lots .header th {
      background-color: #f3e7cf;
      color: var(--ink);
      font-weight: normal;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 1px;
    }

    #lots tr:last-child td {
      border-bottom: none;
    }

    .lot-no {
      color: var(--gold-dark);
      font-weight: bold;
    }

    .item-name {
      font-weight: bold;
    }

    .item-desc {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: normal;
    }

    .price {
      font-variant-numeric: tabular-nums;
      font-weight: bold;
    }

    .time-left {
      font-variant-numeric: tabular-nums;
    }

    .ending-soon {
      color: var(--burgundy);
      font-weight: bold;
    }

    .sold {
      color: var(--muted);
      font-style: italic;
    }

    tr.just-bid td {
      animation: flash 1.2s ease;
    }

    @keyframes flash {
      from { background-color: #f7e2a8; }
      to { background-color: transparent; }
    }

    .history {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 100%;
    }

    .history li {
      padding: 8px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 0.92rem;
    }

    .history li:last-child {
      border-bottom: none;
    }

    .history .empty {
      color: var(--muted);
      font-style: italic;
    }

    .history-box {
      justify-content: flex-start;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1 class="page-title">The Gilded Gavel Auction House</h1>
    <p class="tagline">Fine antiques &amp; collectibles &mdash; place your bid before the hammer falls</p>
    <div class="divider"></div>
  </header>

  <div class="row">
    <div class="box">
      <button id="welcomeButton" class="secondary">How it works</button>
    </div>

    <div class="box gavel-box">
      <svg id="gavel" class="gavel" width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="Auction gavel">
        <g transform="rotate(-40 32 32)">
          <rect x="14" y="10" width="30" height="16" rx="3" fill="#6e1f2b" />
          <rect x="10" y="12" width="6" height="12" rx="2" fill="#b8892f" />
          <rect x="42" y="12" width="6" height="12" rx="2" fill="#b8892f" />
          <rect x="26" y="24" width="6" height="32" rx="3" fill="#8c6420" />
        </g>
        <rect x="34" y="54" width="26" height="6" rx="2" fill="#b8892f" />
      </svg>
      <span class="gavel-caption">Hover the gavel</span>
    </div>

    <div class="box bid-box">
      <form id="bidForm" novalidate>
        <label>
          Your name
          <input type="text" id="nameInput" name="nameInput" autocomplete="name" />
        </label>
        <label>
          Your bid ($)
          <input type="number" id="bidAmount" name="bidAmount" min="1" step="1" />
        </label>
        <label class="full">
          Lot
          <select id="lotSelect" name="lotSelect"></select>
        </label>
        <button type="submit" class="full">Place Bid</button>
        <p id="bidMessage" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <section class="catalogue">
    <h2>Lot Catalogue</h2>

    <div class="box search-box">
      <input type="text" id="myInput" placeholder="Search lots by name or category..." title="Search lots" />
    </div>

    <div class="box table-box">
      <table id="lots">
        <thead>
          <tr class="header">
            <th style="width:8%;">Lot</th>
            <th>Item</th>
            <th style="width:14%;">Category</th>
            <th style="width:14%;">Current Bid</th>
            <th style="width:8%;">Bids</th>
            <th style="width:14%;">Time Left</th>
          </tr>
        </thead>
        <tbody id="lotRows"></tbody>
      </table>
    </div>

    <h2>Recent Bids</h2>
    <div class="box history-box">
      <ul id="bidHistory" class="history">
        <li class="empty">No bids placed yet.</li>
      </ul>
    </div>
  </section>

  <script>
    const MIN_INCREMENT = 10;

    const lots = [
      { id: 101, name: "Victorian Gold Pocket Watch", desc: "18k case, hand-engraved, c. 1885", category: "Jewelry", bid: 1200, bids: 7, minutes: 42 },
      { id: 102, name: "Oil Painting: Harbor at Dusk", desc: "Signed, gilt frame, 24 x 36 in.", category: "Fine Art", bid: 3400, bids: 12, minutes: 95 },
      { id: 103, name: "Ming-Style Porcelain Vase", desc: "Blue & white, 14 in. tall", category: "Ceramics", bid: 850, bids: 4, minutes: 18 },
      { id: 104, name: "First Edition Novel", desc: "Clothbound, original dust jacket", category: "Books", bid: 620, bids: 5, minutes: 63 },
      { id: 105, name: "Mid-Century Walnut Armchair", desc: "Restored upholstery, 1958", category: "Furniture", bid: 480, bids: 3, minutes: 7 },
      { id: 106, name: "Rare Silver Coin Set", desc: "Six coins, presentation case", category: "Coins", bid: 950, bids: 9, minutes: 130 }
    ];

    const startTime = Date.now();
    lots.forEach(function (lot) {
      lot.endsAt = startTime + lot.minutes * 60 * 1000;
    });

    function formatMoney(amount) {
      return "$" + amount.toLocaleString("en-US");
    }

    function formatTimeLeft(ms) {
      if (ms <= 0) {
        return "Sold";
      }
      const totalSeconds = Math.floor(ms / 1000);
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const pad = function (n) { return String(n).padStart(2, "0"); };
      return (h > 0 ? h + "h " : "") + pad(m) + "m " + pad(s) + "s";
    }

    function isClosed(lot) {
      return lot.endsAt - Date.now() <= 0;
    }

    function renderLots() {
      const tbody = document.getElementById("lotRows");
      tbody.innerHTML = "";

      lots.forEach(function (lot) {
        const row = document.createElement("tr");
        row.dataset.lotId = lot.id;
        row.innerHTML =
          '<td class="lot-no">#' + lot.id + "</td>" +
          '<td class="item-name">' + lot.name + '<span class="item-desc">' + lot.desc + "</span></td>" +
          "<td>" + lot.category + "</td>" +
          '<td class="price">' + formatMoney(lot.bid) + "</td>" +
          '<td class="bid-count">' + lot.bids + "</td>" +
          '<td class="time-left"></td>';
        tbody.appendChild(row);
      });

      updateTimers();
      searchTable();
    }

    function renderLotOptions() {
      const select = document.getElementById("lotSelect");
      const current = select.value;
      select.innerHTML = "";

      lots.forEach(function (lot) {
        const option = document.createElement("option");
        option.value = lot.id;
        option.disabled = isClosed(lot);
        option.textContent = "#" + lot.id + " " + lot.name + " (min " + formatMoney(lot.bid + MIN_INCREMENT) + ")" + (option.disabled ? " - Sold" : "");
        select.appendChild(option);
      });

      if (current) {
        select.value = current;
      }
    }

    function updateTimers() {
      const rows = document.querySelectorAll("#lotRows tr");
      let anyJustClosed = false;

      rows.forEach(function (row) {
        const lot = lots.find(function (l) { return String(l.id) === row.dataset.lotId; });
        const cell = row.querySelector(".time-left");
        const msLeft = lot.endsAt - Date.now();

        cell.textContent = formatTimeLeft(msLeft);
        cell.classList.toggle("ending-soon", msLeft > 0 && msLeft < 10 * 60 * 1000);
        cell.classList.toggle("sold", msLeft <= 0);

        if (msLeft <= 0 && !lot.closed) {
          lot.closed = true;
          anyJustClosed = true;
        }
      });

      if (anyJustClosed) {
        renderLotOptions();
      }
    }

    function bigImg(x) {
      x.style.width = "64px";
      x.style.height = "64px";
    }

    function normalImg(x) {
      x.style.width = "32px";
      x.style.height = "32px";
    }

    function myFunction() {
      const nameInput = document.getElementById("nameInput");
      const name = nameInput ? nameInput.value.trim() : "";
      const greeting =
        (name ? "Welcome, " + name + "!" : "Welcome to The Gilded Gavel!") +
        "\n\nPick a lot, enter a bid at least " + formatMoney(MIN_INCREMENT) +
        " above the current bid, and press Place Bid. The highest bid when the timer runs out wins.";

      if (typeof alert === "function") {
        alert(greeting);
      }

      return greeting;
    }

    function searchTable() {
      const input = document.getElementById("myInput");
      const tbody = document.getElementById("lotRows");

      if (!input || !tbody) {
        return;
      }

      const filter = input.value.toLowerCase();
      const rows = tbody.getElementsByTagName("tr");

      for (let i = 0; i < rows.length; i++) {
        const text = rows[i].textContent.toLowerCase();
        rows[i].style.display = text.includes(filter) ? "" : "none";
      }
    }

    function setMessage(text, type) {
      const message = document.getElementById("bidMessage");
      message.textContent = text;
      message.className = type;
    }

    function addHistory(name, lot, amount) {
      const list = document.getElementById("bidHistory");
      const empty = list.querySelector(".empty");
      if (empty) {
        empty.remove();
      }

      const item = document.createElement("li");
      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      item.textContent = time + " \u2014 " + name + " bid " + formatMoney(amount) + " on Lot #" + lot.id + " (" + lot.name + ")";
      list.prepend(item);
    }

    function placeBid(event) {
      event.preventDefault();

      const name = document.getElementById("nameInput").value.trim();
      const amount = Number(document.getElementById("bidAmount").value);
      const lotId = Number(document.getElementById("lotSelect").value);
      const lot = lots.find(function (l) { return l.id === lotId; });

      if (!name) {
        setMessage("Please enter your name before bidding.", "error");
        return;
      }
      if (!lot) {
        setMessage("Please choose a lot.", "error");
        return;
      }
      if (isClosed(lot)) {
        setMessage("Bidding on Lot #" + lot.id + " has closed.", "error");
        return;
      }
      if (!Number.isFinite(amount) || amount < lot.bid + MIN_INCREMENT) {
        setMessage("Your bid must be at least " + formatMoney(lot.bid + MIN_INCREMENT) + ".", "error");
        return;
      }

      lot.bid = amount;
      lot.bids += 1;

      renderLots();
      renderLotOptions();
      addHistory(name, lot, amount);
      setMessage("Bid accepted! You are the highest bidder on Lot #" + lot.id + " at " + formatMoney(amount) + ".", "ok");
      document.getElementById("bidAmount").value = "";

      const row = document.querySelector('#lotRows tr[data-lot-id="' + lot.id + '"]');
      if (row) {
        row.classList.add("just-bid");
      }
    }

    function updateInputColor(event) {
      event.target.style.backgroundColor = event.type === "keydown" ? "#f7e2a8" : "#fbeaea";
    }

    function attachInputListeners() {
      const nameInput = document.getElementById("nameInput");
      const searchInput = document.getElementById("myInput");
      const form = document.getElementById("bidForm");
      const gavel = document.getElementById("gavel");
      const welcomeButton = document.getElementById("welcomeButton");

      if (nameInput) {
        nameInput.addEventListener("keydown", updateInputColor);
        nameInput.addEventListener("keyup", updateInputColor);
      }

      if (searchInput) {
        searchInput.addEventListener("keyup", searchTable);
      }

      if (gavel) {
        gavel.addEventListener("mouseover", function () { bigImg(gavel); });
        gavel.addEventListener("mouseout", function () { normalImg(gavel); });
      }

      if (welcomeButton) {
        welcomeButton.addEventListener("click", myFunction);
      }

      if (form) {
        form.addEventListener("submit", placeBid);
      }
    }

    function init() {
      renderLots();
      renderLotOptions();
      attachInputListeners();
      setInterval(updateTimers, 1000);
    }

    if (document.readyState !== "loading") {
      init();
    } else {
      document.addEventListener("DOMContentLoaded", init);
    }
  </script>
</body>
</html>
